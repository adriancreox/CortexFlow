[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortexflow"
version = "1.0.0"
description = "A Cognitive Operating System for production-grade AI agents. Stateful, observable, and built for scale."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["ai", "agents", "llm", "multi-agent", "framework", "cognitive", "orchestration"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "pydantic>=2.7",
    "redis[hiredis]>=5.0",
    "httpx>=0.27",
    "click>=8.1",
    "structlog>=24.1",
    "tenacity>=8.3",
    "anyio>=4.3",
    "rich>=13.7",
    "python-ulid>=2.2",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.28"]
ollama = ["ollama>=0.2"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-redis>=4.6",
    "respx>=0.21",
    "fakeredis>=2.23",
]
all = [
    "cortexflow[openai]",
    "cortexflow[anthropic]",
    "cortexflow[ollama]",
    "cortexflow[dev]",
]

[project.scripts]
cortexflow = "cortexflow.cli.main:cli"

[project.urls]
Homepage = "https://github.com/cortexflow/cortexflow"
Documentation = "https://docs.cortexflow.dev"
Repository = "https://github.com/cortexflow/cortexflow"
Issues = "https://github.com/cortexflow/cortexflow/issues"

[tool.hatch.build.targets.wheel]
packages = ["cortexflow"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "UP", "ANN", "B", "SIM", "TCH"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=cortexflow --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["tests/*", "examples/*"]
